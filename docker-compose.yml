services:
  ml:
    build:
      context: .
      dockerfile: ml/Dockerfile
    env_file:
      - path: .env
        required: false
    working_dir: /workspace
    volumes:
      - .:/workspace
    depends_on:
      - qdrant
    command: bash

  qdrant:
    image: qdrant/qdrant:v1.12.6
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
